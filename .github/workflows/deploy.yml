name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # Upgraded from v2 to v4

      - name: Setup Node
        uses: actions/setup-node@v4  # Upgraded from v1 to v4
        with:
          node-version: 20  # Recommended LTS version

      - name: Install dependencies
        run: npm install
        working-directory: ./vr_image

      - name: Build project
        env:
          VITE_HUGGINGFACE_API_KEY: ${{ secrets.VITE_HUGGINGFACE_API_KEY }}
        run: npm run build
        working-directory: ./vr_image

      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./vr_image/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./vr_image/dist  # Matches build job's upload path

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vr_image/dist  # Path to your built files
          force_orphan: true  # Clean gh-pages branch every time
